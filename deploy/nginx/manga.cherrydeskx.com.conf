# Cherry Manga Studio reverse proxy.
# Install as /etc/nginx/sites-available/manga.cherrydeskx.com and enable it.

server {
    listen 80;
    listen [::]:80;
    server_name manga.cherrydeskx.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name manga.cherrydeskx.com;

    ssl_certificate /etc/nginx/ssl/beezachat.crt;
    ssl_certificate_key /etc/nginx/ssl/beezachat.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
